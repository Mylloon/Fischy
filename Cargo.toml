[package]
name = "fischy"
version = "0.3.0"
edition = "2024"
authors = ["Mylloon"]
description = "Macro for the 'Fisch' roblox game"
readme = "README.md"
repository = "https://git.mylloon.fr/Anri/Fischy"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
enigo = { version = "0.6", features = ["wayland"] }
env_logger = "0.11"
image = "0.25"
imageproc = { version = "0.27", optional = true }
log = "0.4"
rand = "0.10"
rdev = { git = "https://github.com/Narsil/rdev", rev = "b7e201b", features = ["wayland"] }
sysinfo = "0.39"
window_raiser = "0.1"
xcap = "0.9"

[patch.crates-io]
# Remove once xcap publishes with https://github.com/nashaofu/xcap/pull/286 patch applied
xcap = { git = "https://github.com/nashaofu/xcap.git", rev = "5c205f2" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = "symbols"
lto = "thin"
